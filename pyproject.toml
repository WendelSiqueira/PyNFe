[project]
name = "pyNotas"
version = "0.6.5"
description = "Interface library with the Brazilian Electronic Invoice web services"
authors = [
    {name = "TadaSoftware", email = "tadasoftware@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.9, <4"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.32.4,<3",
    "lxml>=5.4.0",
    "signxml>=4.1.0",
    "cryptography>=43.0.3",
    "pyopenssl>=25.1.0,<26",
]

[project.optional-dependencies]
nfse = [
    "suds-community",
    "PyXB-X==1.2.6.3",
]
impressao = ["brazilfiscalreport[damdfe]"]

[project.urls]
Repository = "https://github.com/WendelSiqueira/pyNotas"
Upstream = "https://github.com/TadaSoftware/PyNFe"
Wiki = "https://github.com/TadaSoftware/PyNFe/wiki"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.12.5,<0.13",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pynotas*"]

[tool.setuptools.package-data]
pynotas = ["data/**/*.txt"]

[tool.ruff]
exclude = [
    'pynotas/entidades/__init__.py'
]
line-length = 100

[tool.pytest.ini_options]
pythonpath = "."
addopts = '-p no:warnings'
