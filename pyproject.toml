[project]
# Nome no PyPI: "pynotas" ja e de outro projeto. O import continua `pynotas`.
name = "pynotas-br"
# Versao lida de pynotas/__init__.py (__version__), a mesma usada no verProc da nota
dynamic = ["version"]
description = "Emissão de NF-e e NFC-e em Python, com Reforma Tributária (IBS/CBS) e Simples Nacional"
# Autores do PyNFe original, do qual o pyNotas deriva (ver AUTHORS)
authors = [
    {name = "Marinho Brandão"},
    {name = "TadaSoftware", email = "tadasoftware@gmail.com"},
]
maintainers = [
    {name = "Wendel Siqueira", email = "wendel.don@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.9, <4"
keywords = ["nfe", "nfce", "nota fiscal", "sefaz", "reforma tributaria", "ibs", "cbs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: Portuguese (Brazilian)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.32.4,<3",
    "certifi",
    "lxml>=5.4.0",
    "signxml>=4.1.0",
    "cryptography>=43.0.3",
    "pyopenssl>=25.1.0,<26",
]

[project.optional-dependencies]
impressao = ["brazilfiscalreport[damdfe]"]

[project.urls]
Homepage = "https://github.com/WendelSiqueira/pyNotas"
Repository = "https://github.com/WendelSiqueira/pyNotas"
Issues = "https://github.com/WendelSiqueira/pyNotas/issues"
Changelog = "https://github.com/WendelSiqueira/pyNotas/blob/main/CHANGELOG.md"
"PyNFe original" = "https://github.com/TadaSoftware/PyNFe"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.12.5,<0.13",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.uv]
# A versao e dinamica (lida de pynotas/__init__.py): sem isto, o uv nao
# reinstala o pacote local quando so a versao muda.
cache-keys = [{ file = "pyproject.toml" }, { file = "pynotas/__init__.py" }]

[tool.setuptools.dynamic]
version = {attr = "pynotas.__version__"}

[tool.setuptools.packages.find]
include = ["pynotas*"]

[tool.setuptools.package-data]
# .txt: municipios do IBGE e lista de servicos.
# .xsd: schemas usados na validacao (NF-e/NFC-e e MDF-e). Os de CT-e ficam de fora
# porque a lib so consulta a distribuicao de CT-e, sem validar contra schema.
# .pem: ACs da ICP-Brasil, usadas na verificacao TLS dos servidores da SEFAZ.
pynotas = [
    "data/**/*.txt",
    "data/XSDs/NF-e/*.xsd",
    "data/XSDs/MDF-e/*.xsd",
    "data/certificados/*.pem",
]

[tool.ruff]
exclude = [
    'pynotas/entidades/__init__.py'
]
line-length = 100

[tool.pytest.ini_options]
pythonpath = "."
addopts = '-p no:warnings'
